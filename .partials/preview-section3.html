<!DOCTYPE html>
<html lang="en-GB" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Preview: Section 3, AI built for evidence</title>
<style>
  /* Token + environment harness. This deliberately reproduces the parts of the
     production page that have bitten this section before, so the partial is
     tested against the same hazards it will meet on the homepage. */
  *, *::before, *::after { box-sizing: border-box; }

  :root {
    --nt-bg: #05070E;
    --nt-bg-card: rgba(12, 16, 32, 0.55);
    --nt-bg-hover: rgba(18, 23, 52, 0.72);
    --nt-border: rgba(150, 170, 220, 0.12);
    --nt-border-glow: rgba(45, 212, 191, 0.38);

    --nt-teal: #2DD4BF;
    --nt-teal-dark: #0CC9A8;
    --nt-teal-glow: rgba(45, 212, 191, 0.45);
    --nt-cyan: #22D3EE;
    --nt-violet: #A78BFA;
    --nt-violet-deep: #7C3AED;
    --nt-pink: #F472B6;
    --nt-panel: #0C1020;

    --nt-text-main: #FFFFFF;
    --nt-text-sub: #B8C4E0;
    --nt-text-muted: #8A9BC0;

    --nt-font-display: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
    --nt-font-body: 'Inter', system-ui, -apple-system, sans-serif;
    --nt-font-mono: 'JetBrains Mono', ui-monospace, monospace;

    --nt-radius-xl: 28px;
    --nt-radius-lg: 20px;
    --nt-radius-md: 14px;
    --nt-radius-pill: 999px;

    --nt-ease: cubic-bezier(0.16, 1, 0.3, 1);

    --ca-nav-h: 72px;
    --white: #FFFFFF;
  }

  html, body { margin: 0; padding: 0; }
  body {
    background-color: #05070E;
    color: var(--nt-text-main);
    font-family: var(--nt-font-body);
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
  }

  /* THE TRAP, reproduced verbatim from Assets/css/premium-gloss-2026-05-31.css.
     It paints every heading with a white -> 60%-white vertical gradient clipped
     to the glyphs at specificity (0,1,1). If the partial's reset is written at
     (0,1,0) it loses here exactly as it would on the real page. */
  [data-theme="dark"] h1, [data-theme="dark"] h2, [data-theme="dark"] h3 {
    color: var(--white);
  }
  @supports (background-clip: text) or (-webkit-background-clip: text) {
    [data-theme="dark"] h1, [data-theme="dark"] h2, [data-theme="dark"] h3 {
      background: linear-gradient(to bottom, var(--white) 0%, rgba(255, 255, 255, 0.60) 100%);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
    }
  }

  /* ~100vh of runway above and below so the pinning can actually be scrolled
     through from both directions. */
  .pv-spacer {
    height: 100vh;
    display: grid;
    place-items: center;
    font-family: var(--nt-font-mono);
    font-size: 11px;
    letter-spacing: .16em;
    text-transform: uppercase;
    color: var(--nt-text-muted);
    border-bottom: 1px solid var(--nt-border);
  }
  .pv-spacer:last-of-type { border-bottom: 0; border-top: 1px solid var(--nt-border); }
</style>
</head>
<body>

<div class="pv-spacer">Spacer above</div>

  <!-- The partial is LOADED from disk rather than pasted in, so this harness
       can never drift out of step with the file it is supposed to be testing.
       innerHTML does not execute script elements, so each one is recreated. -->
  <div id="pv-mount"></div>
  <script>
  (function () {
    fetch("./section3-evidence-scroll.html", { cache: "no-store" })
      .then(function (r) {
        if (!r.ok) { throw new Error("partial HTTP " + r.status); }
        return r.text();
      })
      .then(function (html) {
        var mount = document.getElementById("pv-mount");
        mount.innerHTML = html;
        var scripts = mount.querySelectorAll("script");
        for (var i = 0; i < scripts.length; i++) {
          var old = scripts[i];
          var fresh = document.createElement("script");
          fresh.textContent = old.textContent;
          old.parentNode.replaceChild(fresh, old);
        }
        document.body.setAttribute("data-pv-ready", "1");
      })
      .catch(function (err) {
        document.body.setAttribute("data-pv-ready", "error");
        document.body.setAttribute("data-pv-error", String(err && err.message ? err.message : err));
      });
  })();
  </script>

<div class="pv-spacer">Spacer below</div>

</body>
</html>
