name: OG image rebuild — issue #108

# MANUAL ONLY SINCE 2026-09-01. THE `push` TRIGGER IS GONE, AND THE JOB BELOW
# CANNOT SUCCEED ON A RUNNER AS IT STANDS. Read both halves before using it.
#
# WHY THE TRIGGER WENT. It read:
#     push: { branches: [main], paths: ['**/*.html', 'scripts/generate-og-images.js',
#             'crowagent-brand-tokens.css'] }
# `dist/` and `astro/dist/` are both gitignored, so by 2026-09-01 the only tracked
# files `**/*.html` could still match were the FROZEN LEGACY TREE and
# `status/*.html`. Editing a local status board page therefore rebuilt the OG
# cards and auto-committed them to `main`, and a commit on `main` IS a production
# Cloudflare Pages deploy. A board edit could ship a release. Nothing about that
# was intended and nobody chose it.
#
# (changelog.xml was a fourth trigger path, removed the same day. The file does
# not exist in this repository, so the path could never match and the per-release
# cards it claimed to rebuild were never rebuilt by it.)
#
# WHY IT CANNOT RUN HERE ANY MORE. `scripts/generate-og-images.js` now reads the
# SHIPPING pages in `astro/dist` rather than the frozen root HTML, which is what
# fixed the stale card titles. `astro/dist` is gitignored, so a fresh runner
# checkout does not have it, and the generator fails loudly rather than rendering
# a card from nothing. Making this job work would mean adding an `astro build`
# step, which is new billable minutes on every trigger and is a cost decision for
# the owner, not a side effect of a re-pointing change.
#
# HOW OG CARDS ARE REGENERATED NOW: locally, as part of the release, in this
# order, because `astro build` WIPES dist.
#     cd astro && npm run build:deploy     # produces astro/dist
#     cd .. && npm run build:og:force      # reads astro/dist, writes Assets/og
#     cd astro && node scripts/copy-assets.js   # copies the cards back into dist
# Then commit `Assets/og`. That is one local command chain against a build the
# release already has to produce, and it costs nothing.
#
# `workflow_dispatch` is kept rather than deleted so the mechanism and its
# permissions survive for whoever decides what this should become. Dispatching it
# TODAY will fail at "Render OG images" with a message naming the missing build.

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: og-image-rebuild
  cancel-in-progress: true

jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Need full history so the auto-commit doesn't create a shallow
          # ref that conflicts with the pages branch.
          fetch-depth: 0
          # Use the default token; the contents:write permission above lets
          # us push the regenerated PNGs back.
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        # Must INCLUDE optional deps: the OG renderer (@resvg/resvg-js) loads a
        # platform-specific native binary (@resvg/resvg-js-linux-x64-gnu) that is
        # an optionalDependency. `--omit=optional` skipped it (and npm ci still
        # exited 0, so the `|| npm install` fallback never ran) -> "Cannot find
        # module '@resvg/resvg-js-linux-x64-gnu'". Install optionals so it renders.
        run: npm ci || npm install

      - name: Render OG images
        run: npm run build:og

      - name: Detect changes
        id: detect
        run: |
          if [ -n "$(git status --porcelain Assets/og)" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git status --porcelain Assets/og
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No OG image changes detected."
          fi

      - name: Commit and push
        if: steps.detect.outputs.changed == 'true'
        run: |
          git config user.name  "crowagent-platform[bot]"
          git config user.email "crowagent.platform@gmail.com"
          git add Assets/og
          git commit -m "chore(og): regenerate OG images [skip ci]"
          git push origin main
