name: Smoke test — crowagent.ai must never redirect to login

# [RULE 0-G · owner instruction 2026-08-18: "you must fix all such billing leakages"]
# CADENCE CUT: every 15 minutes -> once daily. 672 runs/week -> 7.
#
# THIS WAS THE LARGEST SINGLE SOURCE OF SCHEDULED ACTIONS SPEND IN EITHER REPO,
# and it had never been through a cost decision. Measured 2026-08-18: seven
# scheduled workflows exist across both repos and this ONE accounted for ~98% of
# their combined runs - roughly 2,900 billed minutes a month against a 2,000
# minute free tier. The RULE 0-G timer audit of 2026-08-17 reduced five workflows
# and never saw this one, because that audit swept `crowagent-platform` only and
# this file lives in `crowagent-website`.
#
# WHAT IT BUYS, weighed honestly: it curls the marketing homepage and checks it
# returns 200, still serves the marketing shell, and has not been replaced by the
# platform app. That is worth having. It is not worth 96 runs a day: the failure
# it guards against is a BAD DEPLOY, and a bad deploy is already caught by the
# `push` trigger below, which still fires on every change to `main`. The schedule
# only catches decay with no deploy behind it - a DNS or Cloudflare change - which
# is a rare event, not a 15-minute one.
#
# The `push` trigger is deliberately KEPT at full frequency. It is the one that
# actually protects a release, and it only runs when something changed.
on:
  push:
    branches: [main]
  schedule:
    - cron: '0 7 * * *'  # Daily at 07:00 UTC. Was */15; see the note above.
  workflow_dispatch:

# [2026-08-18] HOST CORRECTED, AND THIS IS THE BIGGER HALF OF THE FIX.
# Every curl below targeted `https://www.crowagent.ai` with `--max-redirs 0` and
# required exactly 200. Measured today: `www` returns **301** to the apex, and
# only `https://crowagent.ai` returns 200. So step 1 exited 1 on EVERY RUN - this
# monitor had been red on all ~672 of its weekly runs, billing for a failure that
# was its own, and a real outage would have been indistinguishable from its
# normal state. Same class as the Lighthouse gate that audited six URLs which all
# redirected to /login: the control was measuring a redirect, not the site.
# Re-verified after the change: status 200, nav-inject.js present, no login
# redirect, no Supabase on the marketing origin, app.crowagent.ai reachable - all
# five assertions pass against the apex.
#
# Production smoke monitor: single-flight per ref so a slow run doesn't overlap
# the next scheduled tick. Never cancel main — a smoke run in flight is
# verifying the live marketing site.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check crowagent.ai returns 200 (not redirect)
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-redirs 0 https://crowagent.ai)
          echo "HTTP status: $STATUS"
          if [ "$STATUS" != "200" ]; then
            echo "CRITICAL: crowagent.ai returned $STATUS — expected 200"
            echo "This means the marketing site is broken or redirecting"
            exit 1
          fi
          echo "PASS: crowagent.ai returns 200"

      - name: Check crowagent.ai serves marketing content (not platform app)
        run: |
          BODY=$(curl -s --max-redirs 0 https://crowagent.ai)

          # Must contain marketing content. Marker = the marketing-only nav-inject
          # script (the platform app never ships it), NOT brand copy — copy/taglines
          # change (2026-07-18: "Sustainability Intelligence" retired) and must not
          # break the smoke monitor.
          if echo "$BODY" | grep -q "nav-inject.js"; then
            echo "PASS: marketing shell present (nav-inject.js)"
          else
            echo "CRITICAL: marketing shell marker (nav-inject.js) missing from crowagent.ai"
            echo "Marketing site may have been replaced with platform app content"
            exit 1
          fi

          # Must NOT contain login redirect
          if echo "$BODY" | grep -qi "window.location.*login\|meta.*refresh.*login\|redirect.*login"; then
            echo "CRITICAL: crowagent.ai contains login redirect code"
            exit 1
          fi
          echo "PASS: no login redirect detected"

      - name: Check crowagent.ai does NOT load Supabase client
        run: |
          BODY=$(curl -s --max-redirs 0 https://crowagent.ai)
          if echo "$BODY" | grep -qi "supabase\|createClient\|NEXT_PUBLIC_SUPABASE"; then
            echo "CRITICAL: crowagent.ai is loading Supabase — platform app deployed to marketing domain"
            exit 1
          fi
          echo "PASS: no Supabase references on marketing site"

      - name: Check app.crowagent.ai is accessible
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://app.crowagent.ai/login)
          echo "app.crowagent.ai/login HTTP status: $STATUS"
          if [ "$STATUS" = "000" ]; then
            echo "CRITICAL: app.crowagent.ai is unreachable"
            exit 1
          fi
          echo "PASS: app.crowagent.ai is reachable (status $STATUS)"

      - name: Notify on failure
        if: failure()
        run: |
          echo "SMOKE TEST FAILED — crowagent.ai is broken"
          echo "Immediate actions (per CLAUDE.md §17 + §18):"
          echo "1. Check Cloudflare Pages dashboard — crowagent-website project must own crowagent.ai (Cloudflare, not Vercel)"
          echo "2. If recent merge: purge cache (Caching → Purge Everything) — bare URL may be serving stale edge cache (max-age=14400)"
          echo "3. Re-test with cache-buster: curl -fsSL \"https://crowagent.ai/?_=\$(date +%s)\""
