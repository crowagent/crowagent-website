name: Robots guard — AI crawlers must stay allowed on crowagent.ai

# NOTE (expected-to-fail-until-fixed): this guard WILL FAIL until the owner
# disables Cloudflare's managed robots.txt in the dashboard. That is the point.
# Cloudflare's "Block AI bots" / managed robots.txt feature prepends a
# "Disallow: /" block (and a "BEGIN Cloudflare Managed content" marker) for AI
# crawlers, overriding the repo robots.txt. A red run here is the visible
# reminder to turn that feature off; once it is off, the guard goes green and
# then acts as the anti-regression alarm if it is ever re-enabled.

on:
  push:
    branches: [main]
  schedule:
    - cron: '17 6 * * *'  # daily at 06:17 UTC
  workflow_dispatch:

# Single-flight per ref: a slow run must not overlap the next scheduled tick.
# Never cancel a main run in flight; it is verifying the live site.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  robots-guard:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      # Node 20 ships on ubuntu-latest runners and provides global fetch.
      # No `npm install` — the script has zero dependencies.
      - name: Verify robots.txt keeps AI crawlers allowed
        run: node scripts/verify-robots.mjs
